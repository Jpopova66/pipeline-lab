# Стенд Artifactory для лабораторной (тот же, что в artifactory-lab,
# плюс порты 8090-8092 для docker-репозиториев — настраиваем на занятии 1).
services:
  postgres:
    image: postgres:16-alpine
    container_name: artifactory-postgres
    environment:
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: password
      POSTGRES_DB: artifactory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifactory -d artifactory"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    container_name: artifactory
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JF_JFCONNECT_ENABLED: "false"   # без этого UI может не открываться
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://postgres:5432/artifactory
      JF_SHARED_DATABASE_USERNAME: artifactory
      JF_SHARED_DATABASE_PASSWORD: password
    ports:
      - "8081:8081"   # Artifactory API
      - "8082:8082"   # веб-интерфейс (router)
      - "8090:8090"   # docker-репозиторий (виртуальный) — назначим на занятии 1
      - "8091:8091"   # docker-staging-local — понадобится на занятии 2
      - "8092:8092"   # docker-release-local — понадобится на занятии 2
    volumes:
      - artifactory_data:/var/opt/jfrog/artifactory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/router/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 40

volumes:
  artifactory_data:
  postgres_data:
